services:
  quiz:
    build:
      context: .
      dockerfile: Dockerfile
    image: live-quiz:seminar
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      RESULTS_DIR: /app/server/results
    # Host Caddy topology: keep the application off the public interface.
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - quiz-results:/app/server/results
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    init: true

volumes:
  quiz-results:
